spring.application.name=carpooling

# Loads .env as a properties source
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Server Configuration
server.port=8080
app.frontend-url=http://localhost:5173

# MongoDB Configuration (Environment variable overrides with local fallback)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/carpoolingdb1}
spring.mongodb.database=${MONGODB_DATABASE:carpoolingdb1}

# Geocoding API
geocoding.api.key=${GEOCODING_API_KEY:}

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Gemini AI API Key
gemini.api.key=${GEMINI_API_KEY:}
